<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستلزمات الطيور</title>
    <link rel="icon" href="img/MP_LOGO.png" type="image/x-icon">
    <link rel="stylesheet" href="g2.css">
</head>
<body>
    <main class="shop-page">
        <div class="page-toolbar">
            <button class="back-button" type="button" onclick="if (history.length > 1) history.back(); else location.href = 'index.html';">
                <span aria-hidden="true">→</span> رجوع
            </button>
        </div>

        <section class="product-grid" aria-label="مستلزمات الطيور">
            <article class="product-card">
                <div class="product-image"><img src="img/ms1.jpeg" alt="معطف ببغاء"></div>
                <div class="product-info">
                    <h2>معطف ببغاء</h2>
                    <p>السعر: 15 ريال</p>
                    <form class="product-actions">
                        <button type="button">أضف للسلة</button>
                        <button type="button">أضف إلى المفضلة</button>
                    </form>
                </div>
            </article>
            <article class="product-card">
                <div class="product-image"><img src="img/ms2.jpeg" alt="حبل للطير"></div>
                <div class="product-info">
                    <h2>حبل للطير</h2>
                    <p>السعر: 22.50 ريال</p>
                    <form class="product-actions">
                        <button type="button">أضف للسلة</button>

                    </form>
                </div>
            </article>
            <article class="product-card">
                <div class="product-image"><img src="img/ms3.jpeg" alt="صندوق حمام للطيور"></div>

                    <h2>صندوق حمام للطيور</h2>
                    <p>السعر: 27.99 ريال</p>

                        <button type="button">أضف إلى المفضلة</button>
                    </form>
                </div>
            </article>
            <article class="product-card">
                <div class="product-image"><img src="img/ms4.jpeg" alt="موزع طعام طيور"></div>
                <div class="product-info">
                    <h2>موزع طعام طيور</h2>
                    <p>السعر: 35.49 ريال</p>
                    <form class="product-actions">
                        <button type="button">أضف للسلة</button>
                        <button type="button">أضف إلى المفضلة</button>
                    </form>
                </div>
            </article>
            <article class="product-card">
                <div class="product-image"><img src="img/ms5.jpeg" alt="3 ملاعق للطير"></div>
                <div class="product-info">
                    <h2>3 ملاعق للطير</h2>
                    <p>السعر: 11.99 ريال</p>
                    <form class="product-actions">
                        <button type="button">أضف للسلة</button>
                        <button type="button">أضف إلى المفضلة</button>
                    </form>
                </div>
            </article>
            <article class="product-card">
                <div class="product-image"><img src="img/ms6.jpeg" alt="ألعاب للطيور"></div>
                <div class="product-info">
                    <h2>العاب للطيور</h2>
                    <p>السعر: 59 ريال</p>
                    <form class="product-actions">
                        <button type="button">أضف للسلة</button>
                        <button type="button">أضف إلى المفضلة</button>
                    </form>
                </div>
            </article>
        </section>

</html>
